<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1F497D">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>OrderPad — UGE Supply Preorder</title>
<link id="manifest" rel="manifest">
<link id="favicon" rel="icon">
<link id="appleicon" rel="apple-touch-icon">
<style>
  :root{
    --blue:#1F497D; --blue2:#2E6BB0; --head:#8EB4D8;
    --yellow:#FFE22E; --green:#59a14f; --greenCell:#C6E0B4;
    --ink:#1b2430; --muted:#6b7683; --line:#e4e8ee; --bg:#f4f6f9; --card:#fff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
    background:var(--bg); color:var(--ink);
    padding-bottom:150px; -webkit-text-size-adjust:100%;
  }
  .topbar{
    position:sticky; top:0; z-index:20;
    background:linear-gradient(135deg,var(--blue2),var(--blue));
    color:#fff; padding:calc(env(safe-area-inset-top) + 12px) 14px 12px;
    display:flex; align-items:center; gap:11px; box-shadow:0 2px 10px rgba(0,0,0,.15);
  }
  .logo{width:38px;height:38px;border-radius:9px;display:block;flex:none;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:.2px}
  .brand .sub{font-size:11px;opacity:.8;margin-top:1px}
  .brand{flex:1;display:flex;align-items:center;gap:11px}
  .tabs{display:flex; margin:10px 14px 2px; background:#e4e9f0; border-radius:12px; padding:4px; gap:4px}
  .tabs button{flex:1; border:none; background:transparent; padding:11px; border-radius:9px; font-size:14px; font-weight:800; color:var(--muted); cursor:pointer}
  .tabs button.active{background:#fff; color:var(--blue); box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .tabs button.active.safety{color:#8a1f1f}
  .meta-row{display:flex; gap:8px; padding:8px 14px 2px; align-items:center}
  .chip{background:var(--card); border:1px solid var(--line); border-radius:999px; padding:8px 12px; font-size:13px; font-weight:600; display:flex; align-items:center; gap:6px}
  .date-chip input{border:none; font:inherit; font-weight:700; color:var(--ink); background:transparent; width:118px}
  .loc-chip{flex:1}
  .loc-chip input{border:none; font:inherit; font-weight:700; color:var(--ink); background:transparent; width:100%; text-transform:uppercase}
  .loc-chip input::placeholder{text-transform:none;color:#aab2bd;font-weight:600}
  .seg{display:inline-flex; background:#e4e9f0; border-radius:10px; padding:3px}
  .seg button{border:none;background:transparent;padding:8px 16px;border-radius:8px;font-weight:800;font-size:13px;color:var(--muted);cursor:pointer}
  .seg button.active{background:#fff;color:var(--blue);box-shadow:0 1px 2px rgba(0,0,0,.12)}
  .count-chip{margin-left:auto; color:var(--muted)}
  .fname{padding:6px 18px 2px; font-size:11.5px; color:var(--muted); word-break:break-all; line-height:1.5}
  .fname b{color:var(--blue); font-weight:700}
  /* safety tools */
  .safety-tools{display:none; gap:8px; padding:6px 14px 4px}
  .safety-tools.show{display:flex}
  .safety-tools button{flex:1; background:var(--card); border:1px solid var(--line); border-radius:10px; padding:11px; font-size:13px; font-weight:700; color:var(--blue); cursor:pointer}
  .safety-tools button.warn{color:#c0392b; flex:none; padding-left:16px; padding-right:16px}
  /* list */
  #list{padding:6px 10px 4px}
  .item{
    background:var(--card); border:1px solid var(--line); border-left:5px solid var(--line);
    border-radius:12px; margin:8px 4px; padding:10px 12px; display:flex; align-items:center; gap:9px;
  }
  .item.tier-1{border-left-color:var(--yellow); background:linear-gradient(90deg,#fffdf0, #fff 55%)}
  .item.tier-2{border-left-color:#9db9d8}
  .item.tier-3{border-left-color:#c3c8cf}
  .item.filled{box-shadow:0 0 0 2px rgba(89,161,79,.25) inset}
  .info{flex:1;min-width:0}
  .name{font-weight:700; font-size:14px; line-height:1.2; word-break:break-word}
  .meta{font-size:11.5px; color:var(--muted); margin-top:3px; display:flex; align-items:center; flex-wrap:wrap; gap:2px}
  .tbadge{display:inline-block; font-size:10px; font-weight:800; color:var(--blue); background:#eef3fb; border-radius:5px; padding:1px 5px; margin-left:6px; vertical-align:1px}
  .tier-1 .tbadge{background:#fff2b0; color:#7a5a00}
  .swatch{width:15px;height:15px;border-radius:4px;border:1px solid rgba(0,0,0,.25);display:inline-block;margin-right:5px;flex:none}
  .qty{display:flex; align-items:center; gap:0; flex:none}
  .qty button{width:38px;height:40px;border:1px solid var(--line);background:#f7f9fc;font-size:22px;line-height:1;color:var(--blue);cursor:pointer}
  .qty button:active{background:#e9eef6}
  .qty .minus{border-radius:10px 0 0 10px}
  .qty .plus{border-radius:0 10px 10px 0}
  .qty input{
    width:46px;height:40px;border:1px solid var(--line);border-left:none;border-right:none;
    text-align:center; font-size:17px; font-weight:800; color:var(--ink); background:#fff; -moz-appearance:textfield;
  }
  .qty input::-webkit-outer-spin-button,.qty input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .qty input:focus{outline:none;background:#fffdf0}
  .del-x{width:34px;height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;color:#c0392b;font-size:15px;flex:none;cursor:pointer}
  /* bottom bar */
  .bottombar{
    position:fixed; left:0; right:0; bottom:0; z-index:20;
    background:rgba(255,255,255,.97); backdrop-filter:blur(8px); border-top:1px solid var(--line);
    padding:11px 14px calc(env(safe-area-inset-bottom) + 10px);
    display:flex; flex-direction:column; gap:10px;
  }
  .sendopt{display:flex; align-items:center; gap:10px; font-size:14px; font-weight:700; color:var(--ink); cursor:pointer}
  .sendopt input{width:22px;height:22px;accent-color:var(--blue);flex:none}
  .sendopt .cnt{color:var(--muted);font-weight:600}
  .btnrow{display:flex; gap:10px}
  .btnrow button{border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;padding:15px}
  .ghost{background:#eef1f5;color:var(--muted);flex:none;padding-left:20px;padding-right:20px}
  .primary{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;flex:1;box-shadow:0 4px 12px rgba(31,73,125,.35)}
  .primary:active{transform:translateY(1px)}
  #toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#1b2430;color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;font-weight:600;
    transition:.25s;z-index:40;pointer-events:none;max-width:88vw;text-align:center}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
</style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img id="logo" class="logo" alt="">
      <div><h1>OrderPad</h1><div class="sub">UGE Preorder</div></div>
    </div>
  </header>

  <div class="tabs">
    <button id="tabSupplies" class="active">Supplies</button>
    <button id="tabSafety">Safety Cards</button>
  </div>

  <div class="meta-row">
    <div class="chip date-chip">📅 <input id="orderDate" type="date"></div>
    <div class="chip loc-chip">📍 <input id="loc" placeholder="Location (e.g. B CON)" autocapitalize="characters"></div>
  </div>
  <div class="meta-row">
    <div class="seg" id="shiftSeg"><button data-s="AM">AM</button><button data-s="PM">PM</button></div>
    <div class="chip count-chip" id="countChip">0 items</div>
  </div>
  <div class="fname" id="fnamePreview"></div>

  <div class="safety-tools" id="safetyTools">
    <button id="addBtn">＋ Add card</button>
    <button id="resetBtn" class="warn">↺ Restore defaults</button>
  </div>

  <div id="list"></div>

  <div class="bottombar">
    <label class="sendopt"><input type="checkbox" id="inclSafety"> <span>Include Safety Cards order</span> <span class="cnt" id="inclCnt"></span></label>
    <div class="btnrow">
      <button id="clearBtn" class="ghost">Clear</button>
      <button id="sendBtn" class="primary">Generate &amp; Send</button>
    </div>
  </div>

  <div id="toast"></div>
  <a id="dl" style="display:none"></a>

<script>
/* ================= catalogs ================= */
const DEFAULTS = [
  {name:'SCOTT TOILET TISSUE',        unit:'80/Case',   sku:'APL1400D', tier:1},
  {name:'SCOTT MFOLD PAPER TOWEL',    unit:'25/Case',   sku:'APT1410D', tier:1},
  {name:'FACIAL TISSUE',              unit:'60/Case',   sku:'PLT617D',  tier:1},
  {name:'FOAMING HAND SOAP',          unit:'32/Case',   sku:'AAF1130D', tier:1},
  {name:'HUB FLIGHT DECK PACKS',      unit:'50/Bag',    sku:'HFDP',     tier:1},
  {name:'LAVATORY TRASH BAGS',        unit:'500/Case',  sku:'BAG609D',  tier:1},
  {name:'LONG TARMAC DELAY KITS',     unit:'1/Each',    sku:'LT705C',   tier:1},
  {name:'MAXI PADS',                  unit:'250/CS',    sku:'PLT605D',  tier:1},
  {name:'AIR SICKNESS BAGS',          unit:'1000/Case', sku:'AAB1100D', tier:1},
  {name:'JET SCENT LAVATORY SPRAY',   unit:'12/Case',   sku:'LAV602D',  tier:1},
  {name:'INFLIGHT CHECKLISTS',        unit:'1/Each',    sku:'OEC',      tier:1},
  {name:'METAL PATENTED COAT HANGER', unit:'50/Case',   sku:'HGR2025D', tier:1},
  {name:'BISTRO MENUS',               unit:'Case',      sku:'SBCXXXX',  tier:1},
  {name:'CHASE INSERTS',              unit:'Case',      sku:'MPSBI10',  tier:1},
  {name:'BLACK NR HEADPHONES',        unit:'32/Bag',    sku:'MANBLK-CB-32-D', tier:2},
  {name:'BLANKET TOTES',              unit:'Tote',      sku:'BBT-D',    tier:2},
  {name:'CABIN (CLOROX) WIPES',       unit:'Canister',  sku:'138861',   tier:2},
  {name:'EARBUD TOTES',               unit:'Tote',      sku:'MAE-300-ST-D', tier:2},
  {name:'FACE MIST',                  unit:'50/Case',   sku:'MAMB30D',  tier:2},
  {name:'FOAMING HAND SANITIZER',     unit:'32/Case',   sku:'AAC1120D', tier:2},
  {name:'GARMET GROOM',               unit:'50/Case',   sku:'MAGB15D',  tier:2},
  {name:'HAND CREAM',                 unit:'50/Case',   sku:'MAHB30D',  tier:2},
  {name:'INFLIGHT CUSTOMER KITS',     unit:'Tote',      sku:'BCT-D',    tier:2},
  {name:'LAVATORY TOTES',             unit:'Tote',      sku:'BLT-D',    tier:2},
  {name:'UAX ONBOARD TOTE',           unit:'Tote',      sku:'BXT-D',    tier:2},
];
const SAFETY_DEFAULTS = [
  {equip:'A319-G',       pn:'UALSCA319-G',          rev:'R1', color:'Yellow',        hex:'#FFD400'},
  {equip:'A319-F',       pn:'UALSCA319-F',          rev:'R1', color:'Pink',          hex:'#FF7FB0'},
  {equip:'A320-S',       pn:'UALSCA320-SDOM',       rev:'R3', color:'Olive',         hex:'#808000'},
  {equip:'A320-C, S',    pn:'UALSCA320-SOW',        rev:'R1', color:'Light Violet',  hex:'#C9A0DC'},
  {equip:'A321-N (DE)',  pn:'UALSCA321-NEO-N-DE',   rev:'R2', color:'Brown',         hex:'#8B5A2B'},
  {equip:'A321-N (US)',  pn:'UALSCA321-NEO-N-US',   rev:'R2', color:'Grayish Green', hex:'#8A9A5B'},
  {equip:'A321-N (FR)',  pn:'UALSCA321-NEO-N-FR',   rev:'R2', color:'Light Purple',  hex:'#B19CD9'},
  {equip:'B737-G, S',    pn:'UALSCB737-700OW',      rev:'R3', color:'Sandstone',     hex:'#C9AE7C'},
  {equip:'B737-800/900', pn:'UALSCB737-800/900SL',  rev:'R2', color:'Orange',        hex:'#FF7F0E'},
  {equip:'B737-MAX-8/9', pn:'UALSCB737-MAX8/9 OW',  rev:'R2', color:'Goldenrod',     hex:'#DAA520'},
  {equip:'B757-E',       pn:'UALSCB757-E',          rev:'R2', color:'Sea Green',     hex:'#2E8B57'},
  {equip:'B757-S',       pn:'UALSCB757-S',          rev:'R3', color:'Light Blue',    hex:'#ADD8E6'},
  {equip:'B767-L',       pn:'UALSCB767-L',          rev:'R2', color:'Pastel Rose',   hex:'#F7CAC9'},
  {equip:'B767-Q',       pn:'UALSCB767-300-Q',      rev:'R1', color:'Dark Purple',   hex:'#4B2E83'},
  {equip:'B767-U',       pn:'UALSCB767-400-U',      rev:'R1', color:'White',         hex:'#FFFFFF'},
  {equip:'B777-G, M',    pn:'UALSCB777-GM',         rev:'R1', color:'Royal Blue',    hex:'#4169E1'},
  {equip:'B777-E, N, U', pn:'UALSCB777-KR',         rev:'R1', color:'Rust',          hex:'#B7410E'},
  {equip:'B777-O',       pn:'UALSCB777-O',          rev:'R1', color:'Brandywine',    hex:'#7B1E27'},
  {equip:'B777-X',       pn:'UALSCB777-300',        rev:'R2', color:'Hot Pink',      hex:'#FF69B4'},
  {equip:'B787-H, P',    pn:'UALSCB787-8/9 HP',     rev:'R2', color:'Turquoise',     hex:'#40E0D0'},
  {equip:'B787-J',       pn:'UALSCB787-10 J',       rev:'R2', color:'Marigold',      hex:'#FCAE1E'},
];
const CATALOGS = {
  supplies: { defaults:DEFAULTS,        title:'UGE SUPPLIES - PREORDER FORM',     type:'SUPPLIES',     noun:'item' },
  safety:   { defaults:SAFETY_DEFAULTS, title:'UGE SAFETY CARDS - PREORDER FORM', type:'SAFETY CARDS', noun:'card',
              note:'TO BE COMPLETED BY UGE SUPERVISORS or OPS MANAGERS ONLY' },
};

/* ================= state ================= */
function load(k){ try{return JSON.parse(localStorage.getItem(k))}catch(e){return null} }
const clone = a => a.map(o=>({...o}));
function todayStr(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

const store = {
  supplies: { items: load('op_items_v1')        || clone(DEFAULTS),        qty: load('op_qty_v1')        || {} },
  safety:   { items: load('op_safety_items_v1') || clone(SAFETY_DEFAULTS), qty: load('op_safety_qty_v1') || {} },
};
/* new day -> auto-clear quantities from a previous day */
(function newDayReset(){
  const last=localStorage.getItem('op_day');
  if(last && last!==todayStr()){ store.supplies.qty={}; store.safety.qty={}; localStorage.removeItem('op_incl'); }
})();
let mode = localStorage.getItem('op_mode') || 'supplies';
let shiftVal = localStorage.getItem('op_shift') || (new Date().getHours()<12 ? 'AM' : 'PM');

const listEl  = document.getElementById('list');
const dateEl  = document.getElementById('orderDate');
const locEl   = document.getElementById('loc');
const countEl = document.getElementById('countChip');
const fnameEl = document.getElementById('fnamePreview');
const inclEl  = document.getElementById('inclSafety');
const inclCntEl = document.getElementById('inclCnt');

const keyOf = it => (it.sku != null ? it.sku : it.pn);
function save(){
  localStorage.setItem('op_items_v1',        JSON.stringify(store.supplies.items));
  localStorage.setItem('op_qty_v1',          JSON.stringify(store.supplies.qty));
  localStorage.setItem('op_safety_items_v1', JSON.stringify(store.safety.items));
  localStorage.setItem('op_safety_qty_v1',   JSON.stringify(store.safety.qty));
  localStorage.setItem('op_mode', mode);
  localStorage.setItem('op_loc', locEl.value);
  localStorage.setItem('op_shift', shiftVal);
  localStorage.setItem('op_day', todayStr());
}
function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
const safetyFilled = () => store.safety.items.filter(it=>(+store.safety.qty[keyOf(it)]||0)>0).length;

/* ================= render ================= */
function render(){
  const S = store[mode];
  listEl.innerHTML='';
  if(!S.items.length){ listEl.innerHTML='<div class="empty">Empty'+(mode==='safety'?' — tap "Add card".':'.')+'</div>'; }
  S.items.forEach((it,i)=>{
    const key=keyOf(it), q=+S.qty[key]||0;
    const row=document.createElement('div');
    if(mode==='supplies'){
      row.className='item tier-'+(it.tier||2)+(q>0?' filled':'');
      row.innerHTML=`
        <div class="info">
          <div class="name">${esc(it.name)}<span class="tbadge">T${it.tier||2}</span></div>
          <div class="meta">${esc(it.unit)} · ${esc(it.sku)}</div>
        </div>
        <div class="qty">
          <button class="minus">−</button>
          <input type="number" inputmode="numeric" pattern="[0-9]*" min="0" value="${q||''}" placeholder="0">
          <button class="plus">＋</button>
        </div>`;
    } else {
      row.className='item'+(q>0?' filled':'');
      row.style.borderLeftColor = it.hex || '#c3c8cf';
      row.innerHTML=`
        <div class="info">
          <div class="name">${esc(it.equip)}</div>
          <div class="meta"><span class="swatch" style="background:${esc(it.hex)}"></span>${esc(it.color||'')}${it.color?' · ':''}${esc(it.pn)} · ${esc(it.rev)}</div>
        </div>
        <div class="qty">
          <button class="minus">−</button>
          <input type="number" inputmode="numeric" pattern="[0-9]*" min="0" value="${q||''}" placeholder="0">
          <button class="plus">＋</button>
        </div>
        <button class="del-x" title="Delete card">✕</button>`;
    }
    const input=row.querySelector('input');
    row.querySelector('.minus').onclick=()=>setQty(key,(+S.qty[key]||0)-1,input,row);
    row.querySelector('.plus').onclick =()=>setQty(key,(+S.qty[key]||0)+1,input,row);
    input.oninput=()=>setQty(key,input.value,null,row);
    const dx=row.querySelector('.del-x');
    if(dx) dx.onclick=()=>{ if(confirm('Delete '+(it.equip||it.name)+'?')){ delete S.qty[key]; S.items.splice(i,1); save(); render(); } };
    listEl.appendChild(row);
  });
  updateCount(); updateIncl(); updateFnamePreview();
}
function setQty(key,val,input,row){
  const S=store[mode]; let n=Math.max(0,Math.floor(+val||0));
  S.qty[key]=n; save();
  if(input) input.value=n||'';
  if(row) row.classList.toggle('filled', n>0);
  updateCount(); updateIncl(); updateFnamePreview();
}
function updateCount(){
  const S=store[mode], noun=CATALOGS[mode].noun;
  const lines=S.items.filter(it=>(+S.qty[keyOf(it)]||0)>0).length;
  const units=S.items.reduce((s,it)=>s+(+S.qty[keyOf(it)]||0),0);
  countEl.textContent = lines?`${lines} ${noun}${lines>1?'s':''} · ${units} qty`:`${S.items.length} ${noun}s`;
}

/* ================= safety add / restore ================= */
document.getElementById('addBtn').onclick=()=>{
  const S=store.safety;
  const equip=prompt('Equipment / aircraft (e.g. B737-800/900):'); if(!equip)return;
  const pn=prompt('Safety Card P/N:','')||('CARD'+(S.items.length+1));
  const rev=prompt('Rev.:','R1')||'';
  S.items.push({equip:equip.trim(),pn:pn.trim(),rev:rev.trim(),color:'',hex:'#c9ccd1'});
  save(); render();
};
document.getElementById('resetBtn').onclick=()=>{
  if(confirm('Restore the default safety card list? (Quantities cleared.)')){
    store.safety.items=clone(SAFETY_DEFAULTS); store.safety.qty={}; save(); render(); toast('Defaults restored');
  }
};
document.getElementById('clearBtn').onclick=()=>{
  const S=store[mode];
  if(Object.values(S.qty).some(v=>v>0) && !confirm('Clear all quantities on this form?'))return;
  S.qty={}; save(); render(); toast('Quantities cleared');
};

/* ================= tabs / controls ================= */
function setMode(m){
  mode=m;
  document.getElementById('tabSupplies').classList.toggle('active',m==='supplies');
  const ts=document.getElementById('tabSafety'); ts.classList.toggle('active',m==='safety'); ts.classList.toggle('safety',m==='safety');
  document.getElementById('safetyTools').classList.toggle('show',m==='safety');
  save(); render();
}
document.getElementById('tabSupplies').onclick=()=>setMode('supplies');
document.getElementById('tabSafety').onclick  =()=>setMode('safety');

document.querySelectorAll('#shiftSeg button').forEach(b=>{
  b.onclick=()=>{ shiftVal=b.dataset.s; syncShift(); save(); updateFnamePreview(); };
});
function syncShift(){ document.querySelectorAll('#shiftSeg button').forEach(b=>b.classList.toggle('active',b.dataset.s===shiftVal)); }
locEl.oninput =()=>{ save(); updateFnamePreview(); };
dateEl.onchange=()=>{ save(); updateFnamePreview(); };

/* include-safety decision: explicit override, else auto when safety has qty */
function includeSafety(){ const o=localStorage.getItem('op_incl'); return o!=null ? o==='1' : safetyFilled()>0; }
inclEl.onchange=()=>{ localStorage.setItem('op_incl', inclEl.checked?'1':'0'); updateFnamePreview(); };
function updateIncl(){ inclEl.checked=includeSafety(); const n=safetyFilled(); inclCntEl.textContent = n?`(${n} card${n>1?'s':''})`:''; }

function pad2(n){ return String(n).padStart(2,'0'); }
function fileMeta(m){
  const [Y,M,D]=dateEl.value.split('-').map(Number);
  const dd=`${pad2(M)}.${pad2(D)}.${String(Y).slice(-2)}`;
  const loc=(locEl.value.trim()||'').toUpperCase();
  const base=`${dd} UGE ${loc?loc+' ':''}${CATALOGS[m].type} ${shiftVal} SHIFT ORDER`;
  return { base, human:`${M}/${D}/${Y}`, loc, shift:shiftVal };
}
function updateFnamePreview(){

/* ================= PDF engine (self-contained, no libraries) ================= */
const HW=[278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
function tw(str,size){ let w=0; for(const ch of String(str)){ const c=ch.charCodeAt(0); w+=(c>=32&&c<=126?HW[c-32]:556); } return w/1000*size; }
function pesc(s){ return String(s).replace(/\\/g,'\\\\').replace(/\(/g,'\\(').replace(/\)/g,'\\)').replace(/[^\x20-\x7e]/g,''); }
function nn(x){ return (Math.round(x*100)/100).toString(); }
function bytesToBase64(u8){ let bin=''; const c=0x8000; for(let i=0;i<u8.length;i+=c){ bin+=String.fromCharCode.apply(null,u8.subarray(i,i+c)); } return btoa(bin); }
function hx(h){ h=String(h||'').replace('#',''); if(h.length===3)h=h.split('').map(c=>c+c).join(''); const n=parseInt(h,16); return isNaN(n)?[1,1,1]:[((n>>16)&255)/255,((n>>8)&255)/255,(n&255)/255]; }
function fit(str,size,maxw){ let s=String(str); if(tw(s,size)<=maxw)return s; while(s.length>2 && tw(s+'.',size)>maxw) s=s.slice(0,-1); return s+'.'; }
function newDraw(){
  const ops=[];
  return { ops,
    fill:(x,y,w,h,r,g,b)=>ops.push(`${nn(r)} ${nn(g)} ${nn(b)} rg`,`${nn(x)} ${nn(y)} ${nn(w)} ${nn(h)} re f`),
    stroke:(x,y,w,h)=>ops.push(`0.72 0.75 0.79 RG`,`0.6 w`,`${nn(x)} ${nn(y)} ${nn(w)} ${nn(h)} re S`),
    text:(t,x,y,size,bold,r,g,b)=>ops.push('BT',`/F${bold?2:1} ${size} Tf`,`${nn(r)} ${nn(g)} ${nn(b)} rg`,`${nn(x)} ${nn(y)} Td`,`(${pesc(t)}) Tj`,'ET'),
  };
}
function pdfFromOps(ops){
  const content=ops.join('\n');
  const objs=[
    '<</Type/Catalog/Pages 2 0 R>>',
    '<</Type/Pages/Kids[3 0 R]/Count 1>>',
    '<</Type/Page/Parent 2 0 R/MediaBox[0 0 612 792]/Resources<</Font<</F1 5 0 R/F2 6 0 R>>>>/Contents 4 0 R>>',
    `<</Length ${content.length}>>\nstream\n${content}\nendstream`,
    '<</Type/Font/Subtype/Type1/BaseFont/Helvetica/Encoding/WinAnsiEncoding>>',
    '<</Type/Font/Subtype/Type1/BaseFont/Helvetica-Bold/Encoding/WinAnsiEncoding>>'
  ];
  let pdf='%PDF-1.4\n'; const off=[];
  objs.forEach((b,i)=>{ off[i]=pdf.length; pdf+=`${i+1} 0 obj\n${b}\nendobj\n`; });
  const xref=pdf.length;
  pdf+=`xref\n0 ${objs.length+1}\n0000000000 65535 f \n`;
  off.forEach(o=>{ pdf+=String(o).padStart(10,'0')+' 00000 n \n'; });
  pdf+=`trailer\n<</Size ${objs.length+1}/Root 1 0 R>>\nstartxref\n${xref}\n%%EOF`;
  const bytes=new Uint8Array(pdf.length);
  for(let i=0;i<pdf.length;i++) bytes[i]=pdf.charCodeAt(i)&0xff;
  return bytes;
}
function subtitle(meta){ return `${meta.loc?meta.loc+'   -   ':''}${meta.shift} SHIFT   -   Order Date: ${meta.human}`; }

function buildSupplyPDF(rows, meta){
  const d=newDraw(), PW=612;
  const cItem=[40,232], cUnit=[272,86], cSku=[358,150], cQty=[508,64];
  const title=CATALOGS.supplies.title;
  d.text(title,(PW-tw(title,17))/2,748,17,true,.12,.29,.49);
  const sub=subtitle(meta); d.text(sub,(PW-tw(sub,10))/2,730,10,false,.42,.46,.5);
  const tableTop=712,headerH=22,botMargin=52;
  const rowH=Math.min(20, rows.length?((tableTop-headerH)-botMargin)/rows.length:20);
  const size=rowH<15?8:9;
  [[cItem,'ITEM'],[cUnit,'Unit of Issue'],[cSku,'SKU'],[cQty,'QTY:']].forEach(([c,l])=>{
    d.fill(c[0],tableTop-headerH,c[1],headerH,.557,.706,.847); d.stroke(c[0],tableTop-headerH,c[1],headerH);
    d.text(l,c[0]+6,tableTop-headerH+(headerH-10)/2+1.5,10,true,.12,.29,.49);
  });
  let y=tableTop-headerH;
  rows.forEach(it=>{
    const bot=(y-=rowH); const t=it.tier||2;
    let fr=1,fg=1,fb=1,tr=0,tg=0,tb=0;
    if(t===1){ fr=1;fg=1;fb=0; tr=.518;tg=.235;tb=.047; } else if(t===3){ fr=.9;fg=.9;fb=.9; }
    [cItem,cUnit,cSku].forEach(c=>{ d.fill(c[0],bot,c[1],rowH,fr,fg,fb); d.stroke(c[0],bot,c[1],rowH); });
    d.fill(cQty[0],bot,cQty[1],rowH,.776,.878,.706); d.stroke(cQty[0],bot,cQty[1],rowH);
    const base=bot+(rowH-size)/2+1.5;
    d.text(fit(it.name,size,cItem[1]-10),cItem[0]+6,base,size,t===1,tr,tg,tb);
    d.text(it.unit,cUnit[0]+6,base,size,false,tr,tg,tb);
    d.text(fit(it.sku,size,cSku[1]-8),cSku[0]+6,base,size,false,tr,tg,tb);
    const q=+it.qty||0; if(q>0){ const qs=String(q); d.text(qs,cQty[0]+(cQty[1]-tw(qs,size+1))/2,base,size+1,true,0,0,0); }
  });
  return pdfFromOps(d.ops);
}
function buildSafetyPDF(rows, meta){
  const d=newDraw(), PW=612;
  const cEquip=[40,110], cPN=[150,170], cRev=[320,46], cColor=[366,114], cQty=[480,92];
  const title=CATALOGS.safety.title;
  d.text(title,(PW-tw(title,16))/2,752,16,true,.12,.29,.49);
  const note=CATALOGS.safety.note; d.text(note,(PW-tw(note,8.5))/2,736,8.5,true,.66,.12,.12);
  const sub=subtitle(meta); d.text(sub,(PW-tw(sub,9.5))/2,721,9.5,false,.42,.46,.5);
  const tableTop=704,headerH=22,botMargin=52;
  const rowH=Math.min(20, rows.length?((tableTop-headerH)-botMargin)/rows.length:20);
  const size=rowH<15?8:9;
  [[cEquip,'Equipment'],[cPN,'Safety Card P/N'],[cRev,'Rev.'],[cColor,'Color'],[cQty,'QTY:']].forEach(([c,l])=>{
    d.fill(c[0],tableTop-headerH,c[1],headerH,.557,.706,.847); d.stroke(c[0],tableTop-headerH,c[1],headerH);
    d.text(fit(l,10,c[1]-8),c[0]+5,tableTop-headerH+(headerH-10)/2+1.5,10,true,.12,.29,.49);
  });
  let y=tableTop-headerH;
  rows.forEach(it=>{
    const bot=(y-=rowH);
    [cEquip,cPN,cRev,cColor].forEach(c=>{ d.fill(c[0],bot,c[1],rowH,1,1,1); d.stroke(c[0],bot,c[1],rowH); });
    d.fill(cQty[0],bot,cQty[1],rowH,.776,.878,.706); d.stroke(cQty[0],bot,cQty[1],rowH);
    const base=bot+(rowH-size)/2+1.5;
    d.text(fit(it.equip,size,cEquip[1]-8),cEquip[0]+5,base,size,true,0,0,0);
    d.text(fit(it.pn,size,cPN[1]-8),cPN[0]+5,base,size,false,0,0,0);
    d.text(fit(it.rev,size,cRev[1]-6),cRev[0]+5,base,size,false,0,0,0);
    const sw=Math.min(11,rowH-6), sx=cColor[0]+6, sy=bot+(rowH-sw)/2, rgb=hx(it.hex);
    d.fill(sx,sy,sw,sw,rgb[0],rgb[1],rgb[2]); d.stroke(sx,sy,sw,sw);
    d.text(fit(it.color||'',size,cColor[1]-(sw+16)),sx+sw+6,base,size,false,0,0,0);
    const q=+it.qty||0; if(q>0){ const qs=String(q); d.text(qs,cQty[0]+(cQty[1]-tw(qs,size+1))/2,base,size+1,true,0,0,0); }
  });
  return pdfFromOps(d.ops);
}

/* ================= generate & send ================= */
document.getElementById('sendBtn').onclick=async()=>{
  const files=[]; // {name, bytes}
  const sMeta=fileMeta('supplies');
  const sRows=store.supplies.items.map(it=>({...it, qty:+store.supplies.qty[keyOf(it)]||0}));
  files.push({ name:sMeta.base+'.pdf', bytes:buildSupplyPDF(sRows,sMeta) });
  if(includeSafety()){
    const fMeta=fileMeta('safety');
    const fRows=store.safety.items.map(it=>({...it, qty:+store.safety.qty[keyOf(it)]||0}));
    files.push({ name:fMeta.base+'.pdf', bytes:buildSafetyPDF(fRows,fMeta) });
  }
  const subject=sMeta.base;

  // native Android (multi-file aware)
  if(window.Android && typeof window.Android.sharePdfs==='function'){
    window.__nativeShareError=(m)=>toast('Share failed: '+(m||''));
    window.Android.sharePdfs(JSON.stringify(files.map(f=>f.name)), JSON.stringify(files.map(f=>bytesToBase64(f.bytes))));
    toast('Opening share…'); return;
  }
  if(window.Android && typeof window.Android.sharePdf==='function'){ // older single-file build
    window.Android.sharePdf(bytesToBase64(files[0].bytes), files[0].name);
    toast(files.length>1?'Sent supplies — update app to attach safety':'Opening share…'); return;
  }
  // web share sheet
  const fileObjs=files.map(f=>new File([f.bytes],f.name,{type:'application/pdf'}));
  try{
    if(navigator.canShare && navigator.canShare({files:fileObjs})){
      await navigator.share({files:fileObjs, title:subject, text:subject});
      toast('Shared ✔'); return;
    }
  }catch(e){ if(e && e.name==='AbortError') return; }
  // download fallback (one or two files)
  for(const f of files){
    const url=URL.createObjectURL(new Blob([f.bytes],{type:'application/pdf'}));
    const a=document.getElementById('dl'); a.href=url; a.download=f.name; a.click();
    await new Promise(r=>setTimeout(r,500)); URL.revokeObjectURL(url);
  }
  toast(files.length>1?'2 PDFs saved':'PDF saved');
};

/* ================= toast ================= */
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ================= app icon ================= */
function roundRect(x,ctx,X,Y,W,H,R){ ctx.beginPath();
  ctx.moveTo(X+R,Y); ctx.arcTo(X+W,Y,X+W,Y+H,R); ctx.arcTo(X+W,Y+H,X,Y+H,R);
  ctx.arcTo(X,Y+H,X,Y,R); ctx.arcTo(X,Y,X+W,Y,R); ctx.closePath(); }
function makeIcon(S){
  const c=document.createElement('canvas'); c.width=c.height=S; const x=c.getContext('2d');
  const g=x.createLinearGradient(0,0,S,S); g.addColorStop(0,'#2E6BB0'); g.addColorStop(1,'#1F497D');
  roundRect(x,x,0,0,S,S,S*0.22); x.fillStyle=g; x.fill();
  const pw=S*0.52, ph=S*0.62, px=(S-pw)/2, py=S*0.20;
  x.save(); x.shadowColor='rgba(0,0,0,.25)'; x.shadowBlur=S*0.03; x.shadowOffsetY=S*0.015;
  roundRect(x,x,px,py,pw,ph,S*0.05); x.fillStyle='#ffffff'; x.fill(); x.restore();
  x.save(); roundRect(x,x,px,py,pw,ph*0.22,S*0.05); x.clip(); x.fillStyle='#FFD400'; x.fillRect(px,py,pw,ph*0.22); x.restore();
  x.fillStyle='#c7d2e0'; const lx=px+pw*0.14, lw=pw*0.62, lh=S*0.028, gap=ph*0.16;
  for(let i=0;i<3;i++){ roundRect(x,x,lx,py+ph*0.36+i*gap,lw,lh,lh/2); x.fill(); }
  const cr=S*0.12, cx=px+pw*0.86, cy=py+ph*0.86;
  x.beginPath(); x.arc(cx,cy,cr,0,7); x.fillStyle='#4c9a3f'; x.fill();
  x.strokeStyle='#fff'; x.lineWidth=S*0.028; x.lineCap='round'; x.lineJoin='round';
  x.beginPath(); x.moveTo(cx-cr*0.45,cy); x.lineTo(cx-cr*0.08,cy+cr*0.4); x.lineTo(cx+cr*0.5,cy-cr*0.45); x.stroke();
  return c.toDataURL('image/png');
}
(function initIcons(){

  document.getElementById('logo').src=i192;
  document.getElementById('favicon').href=i192;

})();
